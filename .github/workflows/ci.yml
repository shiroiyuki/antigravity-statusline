name: CI & Release Flow

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Validate Syntax & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python Syntax
        run: python -m compileall -q scripts tests

      - name: Verify Shell Syntax
        run: bash -n bin/statusline.sh bin/subagent-audit install.sh

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

  release:
    name: GitHub Release & Asset Packaging
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (Full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes from Commits
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || echo "")

          cat << 'EOF' > release_notes.md
          ## 開源供應鏈安全校驗 (Asset Integrity & Verification)

          發布資產附帶 `.sha256` 數位指紋檔案。下載後可在終端執行以下標準指令進行一鍵無人值守校驗：

          ```bash
          sha256sum -c <archive_name>.tar.gz.sha256
          ```

          ---

          ## 本次變更詳情 (What's Changed)

          EOF

          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..${VERSION}" --no-merges --pretty=format:"* %s (%h)" >> release_notes.md
          else
            git log "${VERSION}" --no-merges --pretty=format:"* %s (%h)" >> release_notes.md
          fi
          echo "" >> release_notes.md

      - name: Package Release Assets
        run: |
          VERSION="${GITHUB_REF_NAME}"
          REPO_NAME="${{ github.event.repository.name }}"
          ARCHIVE_NAME="${REPO_NAME}-${VERSION}.tar.gz"

          tar --exclude='.git' --exclude='.github' -czvf "/tmp/${ARCHIVE_NAME}" .
          mv "/tmp/${ARCHIVE_NAME}" .
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            *.tar.gz
            *.tar.gz.sha256
            install.sh
          generate_release_notes: true
          draft: false
          prerelease: false
